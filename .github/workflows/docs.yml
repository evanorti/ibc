# Runs every tutorial each night. A page that broke is repaired by an agent and
# offered as a pull request; one the agent could not fix becomes an issue and
# turns the run red.
#
# Red means "something broke that an agent could not fix". A guide that broke
# and WAS fixed leaves a green run and a pull request: the pull request is the
# signal. A daily job that goes red for routine drift gets ignored.
#
# A scheduled workflow runs only from the default branch, on this repository's
# own code, so there is no untrusted input to guard against here. Do not add
# pull_request or pull_request_target to the triggers below: the repair job
# holds a write token and runs an agent.
#
# The minute is off the hour on purpose. Scheduled runners are contended at :00
# and runs there get delayed or dropped.

name: Docs

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

# A manual run should not collide with the nightly one over the same pages, but
# neither should cancel the other halfway through a repair.
concurrency:
  group: docs
  cancel-in-progress: false

# actions: read lets the agent look up the last green run with `gh run list`.
# id-token: the action mints an OIDC token to obtain its GitHub app token and
# fails without it.
permissions:
  actions: read
  contents: write
  pull-requests: write
  issues: write
  id-token: write

env:
  DOCS_DIR: docs
  # The pages redirect the CLI at this home rather than the reader's ~/.ibc,
  # and their cleanup removes it. It must be set for every job that runs a page.
  DOCCI_IBC_HOME: /tmp/docci-ibc-home

jobs:
  list:
    name: List pages
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.list.outputs.pages }}
      any: ${{ steps.list.outputs.any }}
    steps:
      - uses: actions/checkout@v4

      # A page is runnable if it carries a docci directive. docci skips a page
      # that says `runnable: false` itself and exits 0 on a page with no
      # directives, so nothing else decides what "runnable" means.
      - name: Find pages with docci directives
        id: list
        run: |
          set -eu
          grep -rlE --include='*.md' --include='*.mdx' '\{/\* docci|<!-- docci' "$DOCS_DIR" \
            | sort > pages.txt || true
          echo "pages:"; cat pages.txt
          if [ -s pages.txt ]; then
            pages=$(python3 -c "import json,sys; print(json.dumps([l.strip() for l in open('pages.txt') if l.strip()]))")
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            pages='[]'
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "No pages carry docci directives."
          fi
          echo "pages=$pages" >> "$GITHUB_OUTPUT"

  check:
    name: ${{ matrix.page }}
    needs: list
    if: needs.list.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        page: ${{ fromJSON(needs.list.outputs.pages) }}
    steps:
      - uses: actions/checkout@v4

      # What the pages need in order to run. The CLI tutorial builds ibc from
      # source, so Go comes from the module it builds; jq parses the addresses
      # the page reads back; Docker runs the two Besu chains. Docker is already
      # on the GitHub-hosted runner.
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod

      - name: Install jq
        run: sudo apt-get install -qq -y jq

      # The chain setup script waits 120s for the first RPC response and the
      # limit is not configurable. On a cold runner most of that window goes on
      # pulling the image rather than starting the node, so the page times out
      # for a reason that has nothing to do with what it documents. Pull it
      # first; the page's own commands are untouched.
      - name: Pre-pull the Besu image
        run: docker pull -q hyperledger/besu:25.4.0

      # Comment directives, checkpoints and page-level config are not in
      # upstream docci. Pin a release of the fork that has them.
      - name: Install docci
        run: |
          VERSION=v0.11.0-mdx.1
          BINARY=docci_Linux_x86_64.tar.gz
          curl -fsSL "https://github.com/evanorti/docci/releases/download/${VERSION}/${BINARY}" \
            | sudo tar -xzC /usr/local/bin
          sudo chmod +x /usr/local/bin/docci

      # A broken guide is routine, and the repair job decides the outcome of the
      # run, so this step records its failure and does not fail the job. The
      # output is kept so the failure record is built from the run that actually
      # failed; running the page twice would cost minutes and an intermittent
      # page could pass the second time. No pipefail here (the default shell has
      # none), so the exit status is docci's own, read from PIPESTATUS.
      - name: Run the page
        id: run
        continue-on-error: true
        env:
          PAGE: ${{ matrix.page }}
        run: |
          docci run "$PAGE" --hide-background-logs 2>&1 | tee docci.log
          exit "${PIPESTATUS[0]}"

      # Reads docci.log; it never runs the page.
      - name: Build failure record
        if: steps.run.outcome == 'failure'
        env:
          PAGE: ${{ matrix.page }}
          TRIGGER: ${{ github.event_name }}
        run: |
          mkdir -p failure
          python3 .github/scripts/failure-record.py \
              --page "$PAGE" \
              --base-commit "$GITHUB_SHA" \
              --trigger "$TRIGGER" \
              < docci.log \
            > "failure/$(echo "$PAGE" | tr '/' '-').json"

      - name: Upload failure record
        if: steps.run.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: failure-record-${{ strategy.job-index }}
          path: failure/
          retention-days: 30

  # Decides whether there is anything to repair. Downloading is allowed to find
  # nothing; the job after it is gated on what it found.
  records:
    name: Any failures?
    needs: [list, check]
    if: ${{ !cancelled() && needs.list.outputs.any == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      any: ${{ steps.count.outputs.any }}
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: failure-record-*
          path: failure/
          merge-multiple: true
      - name: Count failure records
        id: count
        run: |
          shopt -s nullglob
          records=(failure/*.json)
          echo "${#records[@]} failure record(s)"
          if [ "${#records[@]}" -gt 0 ]; then echo "any=true" >> "$GITHUB_OUTPUT"; else echo "any=false" >> "$GITHUB_OUTPUT"; fi

  repair:
    name: Repair
    needs: records
    if: ${{ !cancelled() && needs.records.outputs.any == 'true' }}
    runs-on: ubuntu-latest
    env:
      # The agent has `gh` in this job to investigate with.
      GH_TOKEN: ${{ github.token }}
    steps:
      # The whole history: the agent investigates what changed itself.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download failure records
        uses: actions/download-artifact@v4
        with:
          pattern: failure-record-*
          path: failure/
          merge-multiple: true

      - name: Summarise what failed
        run: |
          for record in failure/*.json; do
            python3 - "$record" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          record = json.load(open(sys.argv[1]))
          failures = record.get("failures") or []
          if not failures and record.get("step"):
              failures = [{k: record[k] for k in ("step", "expected", "actual")}]
          omitted = record.get("failures_omitted", 0)
          print(f"### {record['page']}")
          print(f"{len(failures)} failure(s) recorded" + (f", {omitted} more not shown" if omitted else "") + ".\n")
          for i, f in enumerate(failures, 1):
              print(f"#### {i}. {f['step']}\n")
              print("**Expected**\n```\n" + f["expected"] + "\n```\n")
              print("**Actual**\n```\n" + f["actual"] + "\n```\n")
          if omitted:
              print(f"_{omitted} further failure(s) omitted from the record; see the failing run's log._")
          PY
          done

      # What the pages need in order to run. The CLI tutorial builds ibc from
      # source, so Go comes from the module it builds; jq parses the addresses
      # the page reads back; Docker runs the two Besu chains. Docker is already
      # on the GitHub-hosted runner.
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod

      - name: Install jq
        run: sudo apt-get install -qq -y jq

      # The chain setup script waits 120s for the first RPC response and the
      # limit is not configurable. On a cold runner most of that window goes on
      # pulling the image rather than starting the node, so the page times out
      # for a reason that has nothing to do with what it documents. Pull it
      # first; the page's own commands are untouched.
      - name: Pre-pull the Besu image
        run: docker pull -q hyperledger/besu:25.4.0

      # Comment directives, checkpoints and page-level config are not in
      # upstream docci. Pin a release of the fork that has them.
      - name: Install docci
        run: |
          VERSION=v0.11.0-mdx.1
          BINARY=docci_Linux_x86_64.tar.gz
          curl -fsSL "https://github.com/evanorti/docci/releases/download/${VERSION}/${BINARY}" \
            | sudo tar -xzC /usr/local/bin
          sudo chmod +x /usr/local/bin/docci

      # The pull request may touch only the pages that failed. The guard used to
      # emit this list; it is mechanical, so it stays even though the guard went.
      - name: List the failing pages
        id: pages
        run: |
          set -eu
          shopt -s nullglob
          records=(failure/*.json)
          if [ "${#records[@]}" -eq 0 ]; then
            echo "::error::No failure records; there is nothing to repair."
            exit 1
          fi
          {
            echo "pages<<EOF"
            for record in "${records[@]}"; do
              python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['page'])" "$record"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Repair
        id: agent
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # The brief lives in a file so it is reviewed as prose and versioned
          # with the repository; this prompt only points at it.
          prompt: |
            A tutorial failed in CI. Read .github/agent-brief.md and follow it.
            The failure records are in failure/*.json, one per failing page.
            When you finish, write your report to /tmp/repair-report.md: what
            changed, the attributed cause, which tier the fix landed in and why
            no higher tier applied, and the before and after of every assertion
            you touched. That file becomes the pull request body.
            The report must contain one line, on its own, that begins exactly
            "ATTRIBUTED CAUSE: " and names the commit or release you blame in a
            single sentence, or says you found none. A reviewer who has not seen
            your reasoning is given that line, and only that line, to check.
          claude_args: |
            --max-turns 60
            --allowedTools Bash,Read,Edit,Write,Grep,Glob

      # Diagnostic. The action hides the agent's output, which also hides the
      # reason a run ends with zero turns. This prints the one field that says
      # why — the result text — and nothing else the agent read or wrote.
      - name: Why the agent stopped
        if: always() && steps.agent.outputs.execution_file != ''
        run: |
          jq -r '.[] | select(.type == "result")
                     | [.subtype, (.is_error|tostring), (.result // .error // "")]
                     | @tsv' "${{ steps.agent.outputs.execution_file }}" | head -20

      # The review. It is the only check on the repair, so it owns every
      # question the diff cannot answer: whether each command still does what
      # the page says, whether a changed value is what the program really
      # prints, and whether the page got weaker rather than merely different.
      # It gets the failure records, the diff and one marked line of the repair
      # report. It is not given the repair agent's reasoning.
      - name: Prepare a clean review environment
        id: isolate1
        run: |
          set -eu
          # 1. Capture the repair as a patch, then return the checkout to the base commit
          #    with the patch applied and nothing else. This discards whatever the repair
          #    agent's attempts left lying around in the working tree.
          # No pathspec: a pathspec that matches the ignored failure records makes
          # git warn and exit 1. Without one, ignored files are skipped silently.
          git add -A
          # The failure records are an input to this job, not part of the repair.
          # They are gitignored in some repositories and not in others, so unstage
          # them explicitly: a record inside the patch makes the re-apply below
          # fail with "already exists in working directory".
          git reset -q -- failure
          git diff --cached --binary HEAD > "$RUNNER_TEMP/repair.patch"
          # An empty diff is an outcome, not an error: it is what the agent leaves
          # behind when it decides the code is wrong and the page is right. The
          # reviewer still runs, so a correct refusal and a quiet surrender do not
          # look alike.
          git reset -q --hard HEAD
          git clean -fdxq -e failure
          if [ -s "$RUNNER_TEMP/repair.patch" ]; then
            git apply --binary "$RUNNER_TEMP/repair.patch"
          fi

          # 2. What the reviewer is given: the diff, and one line of the repair report.
          #    The cause is read from a marked line only. If the agent did not write the
          #    marker, the reviewer is told none was stated, not handed the report to
          #    search.
          rm -rf /tmp/review-input
          mkdir -p /tmp/review-input
          cp "$RUNNER_TEMP/repair.patch" /tmp/review-input/diff.patch
          cause=$(grep -m1 '^ATTRIBUTED CAUSE: ' /tmp/repair-report.md 2>/dev/null | cut -c1-500 || true)
          printf '%s\n' "${cause:-ATTRIBUTED CAUSE: none stated}" > /tmp/review-input/attributed-cause.txt
          if [ ! -s "$RUNNER_TEMP/repair.patch" ]; then
            echo "The repair agent made no edit. The page is as it was when it failed." \
              > /tmp/review-input/no-edit.txt
          fi

          # 3. Move everything of the repair agent's out of the reviewer's reach: its
          #    report, its execution log and session transcripts, and any earlier
          #    review. Root-owned, mode 700.
          sudo install -d -m 700 -o root -g root /var/withheld
          for f in /tmp/repair-report.md /tmp/review-feedback.md /tmp/review-report.md \
                   "$RUNNER_TEMP"/claude-execution-output.json; do
            if [ -e "$f" ]; then sudo mv -f "$f" /var/withheld/; fi
          done
          rm -rf "$HOME/.claude/projects" /tmp/claude-* 2>/dev/null || true

          # 4. Tear down what the repair agent may have left running.
          if command -v docker >/dev/null 2>&1; then
            docker ps -aq | xargs -r docker rm -f >/dev/null 2>&1 || true
            docker network prune -f >/dev/null 2>&1 || true
            docker volume prune -f >/dev/null 2>&1 || true
          fi
      - name: Review
        id: review1
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            A repair agent edited a failing tutorial and its check now passes.
            You are the reviewer. Read .github/review-brief.md and follow it.
            The failure records are in failure/*.json. The diff the repair
            produced is /tmp/review-input/diff.patch and is already applied to
            this checkout. The repair agent's attributed cause is in
            /tmp/review-input/attributed-cause.txt: treat it as a claim to check.
            You are not given the repair agent's reasoning and must not look for
            it. If /tmp/review-input/no-edit.txt exists, the repair agent made no
            edit at all: judge the page as it stands and decide for yourself
            whether leaving it alone was right. Run the page from this checkout, doing the page's own setup.
            Write your report to /tmp/review-report.md. Its first line must be
            exactly one of
            VERDICT: approve
            VERDICT: revise
            VERDICT: broken
            VERDICT: unsure
            and the rest says what you ran, what you saw, and what decided it.
            A report without that first line is treated as unsure.
          claude_args: |
            --max-turns 40
            --allowedTools Bash,Read,Write,Grep,Glob

      # The action hides the reviewer's output, which also hides a reviewer that
      # finished without writing a report -- which reads downstream as "unsure"
      # with no explanation. Print what it said.
      - name: Why the reviewer stopped (round 1)
        if: always() && steps.review1.outputs.execution_file != ''
        run: |
          jq -r '.[] | select(.type == "result")
                     | [.subtype, (.is_error|tostring), (.result // .error // "")]
                     | @tsv' "${{ steps.review1.outputs.execution_file }}" | head -40

      - name: Read the verdict
        id: verdict1
        env:
          ROUND: "1"
        run: |
          set -eu
          # The verdict is the first line of the report, matched exactly. Anything else,
          # including no report, is "unsure", which blocks.
          verdict=unsure
          if [ -s /tmp/review-report.md ]; then
            first=$(head -n1 /tmp/review-report.md | tr -d '\r' | sed 's/[[:space:]]*$//')
            case "$first" in
              "VERDICT: approve") verdict=approve ;;
              "VERDICT: revise")  verdict=revise ;;
              "VERDICT: broken")  verdict=broken ;;
              "VERDICT: unsure")  verdict=unsure ;;
            esac
          else
            printf 'VERDICT: unsure\n\nThe reviewer wrote no report.\n' > /tmp/review-report.md
          fi
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          echo "Review $ROUND verdict: $verdict" >> "$GITHUB_STEP_SUMMARY"
          sudo cp /tmp/review-report.md "/var/withheld/review-report-$ROUND.md"
          rm -f /tmp/review-report.md
          # Running the page leaves files behind, and a reviewer can edit. Put the tree
          # back to exactly the repair's diff so that only the repair reaches the pull
          # request.
          git reset -q --hard HEAD
          git clean -fdxq -e failure
          if [ -s "$RUNNER_TEMP/repair.patch" ]; then
            git apply --binary "$RUNNER_TEMP/repair.patch"
          fi
      # One revision, once. If the reviewer asks for changes, the repair agent
      # gets them and the reviewer looks again. If it
      # still says revise, the pull request opens with the objections in the
      # body for a human to settle. There is no third round.
      - name: Give the reviewer's changes to the repair agent
        id: feedback
        if: steps.verdict1.outputs.verdict == 'revise'
        run: |
          set -eu
          sudo cp /var/withheld/repair-report.md /tmp/repair-report.md
          sudo cp /var/withheld/review-report-1.md /tmp/review-feedback.md
          sudo chown "$(id -u):$(id -g)" /tmp/repair-report.md /tmp/review-feedback.md

      - name: Revise
        id: agent2
        if: steps.verdict1.outputs.verdict == 'revise'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            A reviewer read your fix and asked for changes. They are in
            /tmp/review-feedback.md. Read .github/agent-brief.md again and
            follow it. Make the changes the reviewer asks for and nothing else;
            if you believe one is wrong, do not make it and say why in your
            report. Run the whole page again and check your diff with
            `docci review`. This is the only revision you get.
            Update /tmp/repair-report.md: keep its ATTRIBUTED CAUSE line, and
            add what you changed in response to the review.
          claude_args: |
            --max-turns 40
            --allowedTools Bash,Read,Edit,Write,Grep,Glob

      - name: Prepare a clean review environment (second round)
        id: isolate2
        if: steps.verdict1.outputs.verdict == 'revise'
        run: |
          set -eu
          # 1. Capture the repair as a patch, then return the checkout to the base commit
          #    with the patch applied and nothing else. This discards whatever the repair
          #    agent's attempts left lying around in the working tree.
          # No pathspec: a pathspec that matches the ignored failure records makes
          # git warn and exit 1. Without one, ignored files are skipped silently.
          git add -A
          # The failure records are an input to this job, not part of the repair.
          # They are gitignored in some repositories and not in others, so unstage
          # them explicitly: a record inside the patch makes the re-apply below
          # fail with "already exists in working directory".
          git reset -q -- failure
          git diff --cached --binary HEAD > "$RUNNER_TEMP/repair.patch"
          # An empty diff is an outcome, not an error: it is what the agent leaves
          # behind when it decides the code is wrong and the page is right. The
          # reviewer still runs, so a correct refusal and a quiet surrender do not
          # look alike.
          git reset -q --hard HEAD
          git clean -fdxq -e failure
          if [ -s "$RUNNER_TEMP/repair.patch" ]; then
            git apply --binary "$RUNNER_TEMP/repair.patch"
          fi

          # 2. What the reviewer is given: the diff, and one line of the repair report.
          #    The cause is read from a marked line only. If the agent did not write the
          #    marker, the reviewer is told none was stated, not handed the report to
          #    search.
          rm -rf /tmp/review-input
          mkdir -p /tmp/review-input
          cp "$RUNNER_TEMP/repair.patch" /tmp/review-input/diff.patch
          cause=$(grep -m1 '^ATTRIBUTED CAUSE: ' /tmp/repair-report.md 2>/dev/null | cut -c1-500 || true)
          printf '%s\n' "${cause:-ATTRIBUTED CAUSE: none stated}" > /tmp/review-input/attributed-cause.txt
          if [ ! -s "$RUNNER_TEMP/repair.patch" ]; then
            echo "The repair agent made no edit. The page is as it was when it failed." \
              > /tmp/review-input/no-edit.txt
          fi

          # 3. Move everything of the repair agent's out of the reviewer's reach: its
          #    report, its execution log and session transcripts, and any earlier
          #    review. Root-owned, mode 700.
          sudo install -d -m 700 -o root -g root /var/withheld
          for f in /tmp/repair-report.md /tmp/review-feedback.md /tmp/review-report.md \
                   "$RUNNER_TEMP"/claude-execution-output.json; do
            if [ -e "$f" ]; then sudo mv -f "$f" /var/withheld/; fi
          done
          rm -rf "$HOME/.claude/projects" /tmp/claude-* 2>/dev/null || true

          # 4. Tear down what the repair agent may have left running.
          if command -v docker >/dev/null 2>&1; then
            docker ps -aq | xargs -r docker rm -f >/dev/null 2>&1 || true
            docker network prune -f >/dev/null 2>&1 || true
            docker volume prune -f >/dev/null 2>&1 || true
          fi
      - name: Review (second round)
        id: review2
        if: steps.verdict1.outputs.verdict == 'revise'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            A repair agent edited a failing tutorial and its check now passes.
            You are the reviewer. Read .github/review-brief.md and follow it.
            The failure records are in failure/*.json. The diff the repair
            produced is /tmp/review-input/diff.patch and is already applied to
            this checkout. The repair agent's attributed cause is in
            /tmp/review-input/attributed-cause.txt: treat it as a claim to check.
            You are not given the repair agent's reasoning and must not look for
            it. If /tmp/review-input/no-edit.txt exists, the repair agent made no
            edit at all: judge the page as it stands and decide for yourself
            whether leaving it alone was right. Run the page from this checkout, doing the page's own setup.
            Write your report to /tmp/review-report.md. Its first line must be
            exactly one of
            VERDICT: approve
            VERDICT: revise
            VERDICT: broken
            VERDICT: unsure
            and the rest says what you ran, what you saw, and what decided it.
            A report without that first line is treated as unsure.
          claude_args: |
            --max-turns 40
            --allowedTools Bash,Read,Write,Grep,Glob

      # The action hides the reviewer's output, which also hides a reviewer that
      # finished without writing a report -- which reads downstream as "unsure"
      # with no explanation. Print what it said.
      - name: Why the reviewer stopped (round 2)
        if: always() && steps.review2.outputs.execution_file != ''
        run: |
          jq -r '.[] | select(.type == "result")
                     | [.subtype, (.is_error|tostring), (.result // .error // "")]
                     | @tsv' "${{ steps.review2.outputs.execution_file }}" | head -40

      - name: Read the verdict (second round)
        id: verdict2
        if: steps.verdict1.outputs.verdict == 'revise'
        env:
          ROUND: "2"
        run: |
          set -eu
          # The verdict is the first line of the report, matched exactly. Anything else,
          # including no report, is "unsure", which blocks.
          verdict=unsure
          if [ -s /tmp/review-report.md ]; then
            first=$(head -n1 /tmp/review-report.md | tr -d '\r' | sed 's/[[:space:]]*$//')
            case "$first" in
              "VERDICT: approve") verdict=approve ;;
              "VERDICT: revise")  verdict=revise ;;
              "VERDICT: broken")  verdict=broken ;;
              "VERDICT: unsure")  verdict=unsure ;;
            esac
          else
            printf 'VERDICT: unsure\n\nThe reviewer wrote no report.\n' > /tmp/review-report.md
          fi
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          echo "Review $ROUND verdict: $verdict" >> "$GITHUB_STEP_SUMMARY"
          sudo cp /tmp/review-report.md "/var/withheld/review-report-$ROUND.md"
          rm -f /tmp/review-report.md
          # Running the page leaves files behind, and a reviewer can edit. Put the tree
          # back to exactly the repair's diff so that only the repair reaches the pull
          # request.
          git reset -q --hard HEAD
          git clean -fdxq -e failure
          if [ -s "$RUNNER_TEMP/repair.patch" ]; then
            git apply --binary "$RUNNER_TEMP/repair.patch"
          fi
      # Fixed means the reviewer approved, or asked for changes that were made.
      # Anything else -- the agent gave up, the reviewer found the code broken, the
      # reviewer was unsure, a step above failed or never ran -- is not fixed,
      # and `always()` is what lets this step see that. A verdict of revise after
      # the one revision is still fixed: the pull request opens with the
      # reviewer's objections in the body for a human to settle.
      - name: Decide
        id: decide
        if: always()
        env:
          V1: ${{ steps.verdict1.outputs.verdict }}
          V2: ${{ steps.verdict2.outputs.verdict }}
        run: |
          set -eu
          fixed=false
          final=""
          round=1
          reason="The repair agent did not produce a fix the reviewer could read."
          if [ -n "$V1" ]; then
            final="$V1"
            if [ "$V1" = revise ]; then
              round=2
              if [ -n "$V2" ]; then
                final="$V2"
              else
                final=""
                reason="The reviewer asked for a revision and the revision never came back."
              fi
            fi
          fi
          case "$final" in
            approve|revise) fixed=true ;;
            broken) reason="The reviewer ran the page and found the code itself broken, not the documentation (round $round)." ;;
            unsure) reason="The reviewer was unsure whether the repair is right (round $round)." ;;
          esac
          echo "fixed=$fixed" >> "$GITHUB_OUTPUT"
          echo "round=$round" >> "$GITHUB_OUTPUT"
          echo "final=$final" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "Outcome: fixed=$fixed final=${final:-none}" >> "$GITHUB_STEP_SUMMARY"

      # The body is the repair report and the review that decided it. A missing
      # repair report is itself a signal worth seeing, so say so in the body.
      - name: Assemble the pull request body
        id: body
        if: steps.decide.outputs.fixed == 'true'
        env:
          ROUND: ${{ steps.decide.outputs.round }}
          FINAL: ${{ steps.decide.outputs.final }}
        run: |
          set -eu
          {
            if sudo test -s /var/withheld/repair-report.md; then
              sudo cat /var/withheld/repair-report.md
            else
              echo "The repair agent produced no report. The reviewer approved the edit, but read it carefully before merging."
            fi
            echo
            echo "---"
            echo
            if [ "$FINAL" = "revise" ]; then
              echo "## Unresolved: the reviewer still asks for changes"
              echo
              echo "The reviewer asked for changes, the repair agent revised once, and the reviewer still asks for more. This is for a human to settle."
            else
              echo "## Review"
              echo
              if [ "$ROUND" = "2" ]; then
                echo "The reviewer asked for one revision first. Its first report is below the second."
              fi
            fi
            echo
            sudo cat "/var/withheld/review-report-$ROUND.md"
            if [ "$ROUND" = "2" ]; then
              echo
              echo "<details><summary>First review</summary>"
              echo
              sudo cat /var/withheld/review-report-1.md
              echo
              echo "</details>"
            fi
          } > /tmp/pr-body.md

      # Cannot run unless Decide said fixed, which requires a reviewer verdict.
      - name: Open a pull request
        if: steps.decide.outputs.fixed == 'true' && steps.body.outcome == 'success'
        uses: peter-evans/create-pull-request@v6
        with:
          base: ${{ github.event.repository.default_branch }}
          branch: docs-repair/${{ github.run_id }}
          # Only the pages that failed. The failure records are never added.
          add-paths: ${{ steps.pages.outputs.pages }}
          title: "docs: repair failing tutorial"
          body-path: /tmp/pr-body.md
          labels: docs-repair

      # Not fixed: one issue per page, or a comment on the one already open.
      - name: File an issue
        if: always() && steps.decide.outputs.fixed != 'true'
        env:
          REASON: ${{ steps.decide.outputs.reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu
          shopt -s nullglob
          gh label create docs-repair-failed --color B60205 \
            --description "A tutorial broke and the repair agent could not fix it" 2>/dev/null || true
          for record in failure/*.json; do
            page=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['page'])" "$record")
            {
              echo "The nightly docs run found \`$page\` broken, and it was not repaired automatically."
              echo
              echo "${REASON:-The repair job stopped before reaching a verdict.}"
              echo
              # The cause the repair agent attributed, if it marked one. It is a
              # claim, not a finding, so it is labelled as one -- but it is the
              # first thing a human wants, so it goes above the fold.
              if sudo test -s /var/withheld/repair-report.md; then
                cause=$(sudo grep -m1 '^ATTRIBUTED CAUSE: ' /var/withheld/repair-report.md | cut -c1-500 || true)
                if [ -n "${cause:-}" ]; then
                  echo "**The repair agent's attributed cause.** ${cause#ATTRIBUTED CAUSE: }"
                  echo
                fi
              fi
              echo "Run: $RUN_URL"
              echo
              python3 - "$record" <<'PY'
          import json, sys
          record = json.load(open(sys.argv[1]))
          for i, f in enumerate(record.get("failures") or [], 1):
              print(f"#### {i}. {f['step']}\n")
              print("Expected\n```\n" + f["expected"] + "\n```\n")
              print("Actual\n```\n" + f["actual"] + "\n```\n")
          PY
              for report in repair-report.md review-report-1.md review-report-2.md; do
                if sudo test -s "/var/withheld/$report"; then
                  echo "<details><summary>$report</summary>"; echo
                  sudo cat "/var/withheld/$report"; echo; echo "</details>"
                fi
              done
            } > "$RUNNER_TEMP/issue-body.md"
            existing=$(gh issue list --state open --label docs-repair-failed \
              --search "in:title \"$page\"" --json number --jq '.[0].number // empty')
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body-file "$RUNNER_TEMP/issue-body.md"
            else
              gh issue create --label docs-repair-failed \
                --title "docs: $page is broken" --body-file "$RUNNER_TEMP/issue-body.md"
            fi
          done

      # The only thing that turns the run red: a break the agent could not fix.
      - name: Fail the run
        if: always() && steps.decide.outputs.fixed != 'true'
        run: |
          echo "::error::A tutorial broke and could not be repaired automatically; an issue was filed."
          exit 1
